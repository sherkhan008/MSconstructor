# ==============================================================================
# MS Shelving — trusted reverse proxy (the ONLY public entry point to the app).
#
# Proxy contract (see docs/production-client-ip-and-rate-limiting.md):
# - The app container publishes no host port; only this proxy can reach it.
# - X-Real-IP is the canonical client IP. It is OVERWRITTEN here with the TCP
#   peer nginx accepted ($remote_addr) — never appended to, so any value a
#   client sends is discarded. The app reads it because the app service sets
#   TRUSTED_PROXY_CLIENT_IP_HEADER=x-real-ip.
# - X-Forwarded-For is overwritten with the same single address (not
#   $proxy_add_x_forwarded_for, which would keep the client-supplied chain).
#
# If another TLS terminator / CDN / load balancer is placed in front of this
# proxy, $remote_addr becomes THAT hop's address. In that case configure
# ngx_http_realip_module here (set_real_ip_from <that hop's exact ranges>;
# real_ip_header <its canonical header>;) and make sure only that hop can
# reach this proxy — never trust a forwarding header from arbitrary sources.
# ==============================================================================

upstream ms_shelving_app {
    server app:3000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    location / {
        proxy_pass http://ms_shelving_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # $http_host keeps the port the browser used, so app-generated
        # redirects (e.g. /admin → /admin/login) stay on the public origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Canonical client IP — overwrite, never append.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

        # Strip other client-supplied forwarding headers. An empty value makes
        # nginx drop the header entirely.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Client-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header CF-Connecting-IP "";
    }
}

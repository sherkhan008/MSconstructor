# ==============================================================================
# MS Shelving — http-level settings shared by both proxy modes (http.conf and
# https.conf.template include this file first).
# ==============================================================================

# Docker's embedded DNS. `resolve` re-resolves `app` while nginx runs, so a
# recreated app container (new IP after every deploy or rollback) is picked
# up without reloading nginx. Requires nginx >= 1.27.3 (image nginx:1.27-alpine).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream ms_shelving_app {
    zone ms_shelving_app 64k;
    server app:3000 resolve;
    keepalive 16;
}

# Do not advertise the nginx version.
server_tokens off;

# Internal readiness listener — bound to the container's own loopback, so it is
# unreachable from the host, from other containers and from the Internet, and
# docker-compose.yml never publishes it. Serves ONLY /api/health, with no
# HTTP→HTTPS redirect in either mode: deploy/nginx/readiness.sh (used by
# scripts/ops/deploy.sh and scripts/ops/proxy.sh) checks proxy → app → health
# here, independent of DNS, certificates and the public redirect.
server {
    listen 127.0.0.1:8081;
    server_name _;
    access_log off;

    location = /api/health {
        include /etc/nginx/ms-shelving/app-proxy.conf;
    }

    location / {
        return 404;
    }
}

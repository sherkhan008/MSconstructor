# ==============================================================================
# MS Shelving proxy — PROXY_TLS_ENABLED=false (HTTP bootstrap mode).
#
# Used before the first certificate exists: serves the app over plain HTTP and
# answers Let's Encrypt HTTP-01 challenges from the host webroot. Keep this
# window short and do not announce the site until TLS is enabled
# (docs/production-deployment.md, §8). Rendered by deploy/nginx/entrypoint.sh.
# ==============================================================================

include /etc/nginx/ms-shelving/common.conf;

server {
    listen 8080 default_server;
    server_name _;

    # ACME HTTP-01 challenges (certbot --webroot -w /var/www/certbot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/ms-shelving/app-proxy.conf;
    }
}

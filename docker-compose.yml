name: ms-shelving

services:
  # The only public entry point. Overwrites X-Real-IP / X-Forwarded-For with
  # the real TCP peer — see deploy/nginx/default.conf and
  # docs/production-client-ip-and-rate-limiting.md.
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "3000:8080"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Deliberately NOT published to the host: the app trusts X-Real-IP, which
    # is only safe while every request arrives through the proxy service.
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://ms_shelving:ms_shelving@postgres:5432/ms_shelving?schema=public
      DIRECT_URL: postgresql://ms_shelving:ms_shelving@postgres:5432/ms_shelving?schema=public
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ms-stellazh.kz}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-ChangeMe123!}
      REDIS_URL: redis://redis:6379
      TRUSTED_PROXY_CLIENT_IP_HEADER: x-real-ip
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ms_shelving
      POSTGRES_PASSWORD: ms_shelving
      POSTGRES_DB: ms_shelving
    ports:
      - "5432:5432"
    volumes:
      - ms_shelving_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ms_shelving -d ms_shelving"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Loopback only: an unauthenticated Redis reachable from outside could
    # have its rate-limit counters deleted.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ms_shelving_redis_data:/data
    restart: unless-stopped

volumes:
  ms_shelving_postgres_data:
  ms_shelving_redis_data:
